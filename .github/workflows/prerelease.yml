# Publica una prerelease con Velopack en cada push a dev: 0.FASE.N-dev (N sube con cada PR fusionado), en el canal «dev» de Velopack.
name: Prerelease

on:
  push:
    branches: [dev]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Dependencias
        run: pnpm install --frozen-lockfile

      - name: Versión (0.FASE.N-dev)
        id: version
        shell: pwsh
        run: |
          "valor=$(./scripts/version.ps1)-dev" >> $env:GITHUB_OUTPUT

      - name: Pruebas
        run: pnpm test

      - name: Instalar vpk
        run: dotnet tool install -g vpk

      - name: Empaquetar
        shell: pwsh
        run: ./scripts/empaquetar.ps1 -Version ${{ steps.version.outputs.valor }} -Channel dev

      - name: Subir a GitHub Releases
        run: vpk upload github --repoUrl https://github.com/${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }} --outputDir artefactos/paquetes --channel dev --pre --publish --releaseName "otterjobs ${{ steps.version.outputs.valor }}" --tag v${{ steps.version.outputs.valor }}
